name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.m"
      - "**/*.h"
      - "Makefile"
      - "Resources/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid xz make || true
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make FINALPACKAGE=1

      - name: Package unsigned IPA
        run: |
          APP=$(find .theos/_/Applications -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XnfAlMufakkir.ipa Payload
          ls -lh XnfAlMufakkir.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: XnfAlMufakkir-ipa
          path: XnfAlMufakkir.ipa
          if-no-files-found: error
