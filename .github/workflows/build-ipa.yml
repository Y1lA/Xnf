name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.m"
      - "**/*.h"
      - "Makefile"
      - "Resources/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    # macos-14 اتقاعدت في ٢ نوفمبر ٢٠٢٦، فما صارت تصير متاحة. macos-15 هو المعيار المدعوم حاليًا (arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid xz make || true
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make FINALPACKAGE=1
          # نسخ Theos تختلف في مكان الـ.app، فنلقطه من أي مكان بعد البناء.
          if ! find . -type d -name '*.app' -not -path './.git/*' | grep -q .; then
            echo "ما طلع .app من make، نجرّب make package"
            make package FINALPACKAGE=1
          fi
          echo "--- ناتج البناء ---"
          find . -type d -name '*.app' -not -path './.git/*' | head -5
          find .theos -maxdepth 4 2>/dev/null | head -40

      - name: Package unsigned IPA
        run: |
          APP=$(find . -type d -name '*.app' -not -path './.git/*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "ما لقيت أي .app — هذي محتويات المشروع:"
            find . -maxdepth 4 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "app: $APP"
          rm -rf Payload XnfAlMufakkir.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XnfAlMufakkir.ipa Payload
          ls -lh XnfAlMufakkir.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: XnfAlMufakkir-ipa
          path: XnfAlMufakkir.ipa
          if-no-files-found: error
